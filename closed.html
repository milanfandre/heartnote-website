<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heart Note has closed</title>
  <meta name="description" content="Heart Note is no longer taking orders. Existing song links still work." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/brand_assets/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    html { font-size: 18px; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #F7F1E6; color: #2B2019; font-family: 'Nunito Sans', sans-serif; line-height: 1.7;
      -webkit-font-smoothing: antialiased; padding: 2rem 1.25rem; box-sizing: border-box;
    }
    main { max-width: 34rem; text-align: center; }
    img { height: 64px; width: auto; }
    h1 { font-family: 'Fraunces', serif; font-weight: 500; color: #6E1423; font-size: 2.6rem; line-height: 1.1; letter-spacing: -0.01em; margin: 1.5rem 0 1.25rem; }
    p { margin: 0 0 1rem; color: #2B2019; opacity: .9; }
    .rule { width: 56px; height: 2px; background: #C6973F; margin: 2rem auto; border: 0; }
    .small { font-size: .9rem; color: #6B5D50; opacity: 1; }
    a { color: #6E1423; font-weight: 700; }
    a:hover { color: #4E0E1A; }
    a:focus-visible { outline: 3px solid #C6973F; outline-offset: 2px; border-radius: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="/brand_assets/heartnote-mark.png" alt="Heart Note" />
    <h1>Heart Note has closed</h1>
    <p>We're no longer taking orders. Thank you to everyone who trusted us with their stories and let us turn them into songs.</p>
    <p>If you already have a Heart Note, the link in your email still opens your song.</p>
    <hr class="rule" />
    <p class="small">Questions about an existing order? Email <a href="mailto:paul@heartnote.music">paul@heartnote.music</a>.</p>
  </main>
</body>
</html>
